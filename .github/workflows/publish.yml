name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore HtmlToPdf.Renderer.slnx -p:EnableWindowsTargeting=true

      - run: dotnet build HtmlToPdf.Renderer.slnx -c Release --no-restore -p:EnableWindowsTargeting=true


      - run: dotnet pack src/HtmlToPdf.Renderer/HtmlToPdf.Renderer.csproj -c Release --no-build -o ./nupkg /p:Version=${{ github.event.release.tag_name }}

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
